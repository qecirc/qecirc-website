qec_id: 1447
name: Transversal logical Clifford (automorphism gen 12)
tool: autqec
notes:
  Logical CNOT(3,5)·CNOT(6,4)·CNOT(2,4)·CNOT(5,3)·SWAP(4,2)·CNOT(4,1)·CZ(4,6)·CZ(2,3)·CZ(5,6)·CZ(4,5)·CZ(3,4)·S(6)·CZ(2,6)·CZ(1,6)·C(X,X)(1,6)·C(X,X)(1,2)·C(X,X)(1,4)
  (gates in application order) from generator 12 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is transversal — single-qubit
  Cliffords, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. The code is the best-known-distance [[17,6]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
