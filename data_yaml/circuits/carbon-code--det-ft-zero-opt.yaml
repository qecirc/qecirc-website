notes: |-
  Deterministic FT state preparation (arXiv:2501.05527); verification variant: global. Body and metrics show the worst-case branch of the adaptive protocol: prep, round-1 verification (always measured), then the most expensive branch's round-2 measurements. The outcome-dependent Pauli correction is not part of the circuit (Pauli-frame update); apply it per the branch tables below (outcome bits MSB-first in measurement order):
  Layer 0 (Z): round-1 measure Z[0,2,3,4,10,11]
    outcome 1: measure Z[2,4,8,10], Z[2,3,6,11], Z[0,2,9,11]; 0 -> X[3], 1 -> X[0], 10 -> X[3,7], 11 -> X[2,8], 100 -> X[4,7], 101 -> X[2], 110 -> X[7], 111 -> X[2,10]
  Layer 1 (X): round-1 measure X[0,1,3,4,8,11]* (* = hook flag)
    outcome 1: measure X[2,5,6,7,9,10]; 0 -> none, 1 -> Z[2]
    hook of stab 0 (outcome 1): measure Z[0,4,6,10]; 0 -> X[11], 1 -> X[0,1]. Source file: scripts/ft_stateprep/eval_det/circuits/carbon/zero_opt.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [12, 13, 14]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [0, 3, 1, 4, 2, 5, 6, 9, 7, 10, 8, 11]
