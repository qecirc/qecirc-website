name: SWAP-transversal logical Clifford (automorphism gen 6)
tool: autqec
notes:
  Logical CNOT(6,5)·CNOT(3,5)·CNOT(2,5)·CNOT(7,4)·CNOT(5,4)·CNOT(3,4)·CNOT(7,3)·CNOT(6,3)·CNOT(5,3)·CNOT(2,3)·CNOT(6,2)·SWAP(3,2)·CNOT(7,1)·CNOT(6,1)·CNOT(5,1)·CNOT(3,1)·CZ(4,6)·CZ(2,3)·CZ(5,6)·CZ(2,7)·S(7)·CZ(6,7)·CZ(3,6)·CZ(1,6)·S(3)·CZ(5,7)·CZ(2,6)·S(5)·CZ(2,5)·√X(4)·C(X,X)(2,4)·C(X,X)(1,3)·C(X,X)(1,5)·C(X,X)(1,4)·√X(3)·C(X,X)(3,5)·C(X,X)(1,2)·√X(2)·√X(5)
  (gates in application order) from generator 6 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[20,7]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
