  Deterministic FT state preparation (arXiv:2501.05527); verification variant: optimal. Body and metrics show the worst-case branch of the adaptive protocol: prep, round-1 verification (always measured), then the most expensive branch's round-2 measurements and classically-controlled Pauli correction. Full branch tables (outcome bits MSB-first in measurement order):
  Layer 0 (Z): round-1 measure Z[1,2,7,8], Z[2,5,8,11]
    outcome 1: measure Z[3,5,9,11], Z[1,4,7,10]; 0 -> none, 1 -> X[3,4], 10 -> none, 11 -> X[1,2,3]
    outcome 10: measure Z[0,4,6,10]; 0 -> none, 1 -> X[6,7,11]
    outcome 11: measure Z[3,5,9,11]; 0 -> none, 1 -> X[6,7,11]
  Layer 1 (X): round-1 measure X[0,2,4,6,8,10]* (* = hook flag)
    outcome 1: measure X[0,3,6,9], X[1,4,7,10]; 0 -> none, 1 -> Z[7,8], 10 -> Z[2,3], 11 -> Z[0,1]
    hook of stab 0 (outcome 1): measure Z[2,3,8,9]; 0 -> none, 1 -> X[7,9,11]. Source file: scripts/ft_stateprep/eval_det/circuits/carbon/zero_heuristic.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,CZ,H,MR. Flag/ancilla qubits: [12, 13]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [0, 3, 1, 4, 2, 5, 6, 9, 7, 10, 8, 11]
