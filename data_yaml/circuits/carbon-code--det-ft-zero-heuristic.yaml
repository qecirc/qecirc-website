notes: |-
  Deterministic FT state preparation (arXiv:2501.05527). The stored
  body and metrics show the WORST-CASE branch of an adaptive protocol
  (fair-comparison convention): prep, then per layer the always-measured
  round-1 verification and the most expensive outcome branch (round-2
  measurements + classically-controlled Pauli correction). The actual
  protocol branches on measurement outcomes as tabulated below
  (round-1 outcome bits are MSB-first in measurement order).
  Verification variant: optimal. Source file: carbon/zero_heuristic.qasm
  --- Layer 0 (Z-stabilizer verification) ---
    round-1 stab 0: Z[1, 2, 7, 8]
    round-1 stab 1: Z[2, 5, 8, 11]
    round-1 outcome 1: measure Z[3, 5, 9, 11], Z[1, 4, 7, 10]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply X[3, 4]
      round-2 outcome 10: no correction
      round-2 outcome 11: apply X[1, 2, 3]
    round-1 outcome 10: measure Z[0, 4, 6, 10]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply X[6, 7, 11]
    round-1 outcome 11: measure Z[3, 5, 9, 11]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply X[6, 7, 11]
  --- Layer 1 (X-stabilizer verification) ---
    round-1 stab 0: X[0, 2, 4, 6, 8, 10] [hook flag]
    round-1 outcome 1: measure X[0, 3, 6, 9], X[1, 4, 7, 10]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply Z[7, 8]
      round-2 outcome 10: apply Z[2, 3]
      round-2 outcome 11: apply Z[0, 1]
    hook flag of stab 0 (outcome 1): measure Z[2, 3, 8, 9]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply X[7, 9, 11]. Source file: scripts/ft_stateprep/eval_det/circuits/carbon/zero_heuristic.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,CZ,H,MR. Flag/ancilla qubits: [12, 13]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [0, 3, 1, 4, 2, 5, 6, 9, 7, 10, 8, 11]
