  Logical H(1)·CNOT(5,8)·CNOT(4,8)·CNOT(8,7)·CNOT(6,7)·CNOT(4,7)·CNOT(3,7)·CNOT(1,7)·CNOT(8,6)·CNOT(3,6)·CNOT(2,5)·CNOT(1,5)·SWAP(6,5)·CNOT(8,4)·CNOT(6,4)·CNOT(3,4)·CNOT(2,4)·CNOT(1,4)·SWAP(5,4)·CNOT(7,3)·CNOT(5,3)·CNOT(4,3)·CNOT(2,3)·CNOT(1,3)·CNOT(8,2)·SWAP(5,2)·CNOT(7,1)·SWAP(5,1)·CZ(3,7)·CZ(5,8)·CZ(4,5)·S(1)·CZ(2,7)·CZ(7,8)·CZ(4,7)·CZ(1,5)·S(3)·CZ(1,3)·CZ(5,7)·CZ(1,7)·CZ(2,5)·CZ(3,5)·C(X,X)(6,7)·C(X,X)(1,8)·C(X,X)(1,3)·C(X,X)(3,7)·C(X,X)(4,5)·C(X,X)(3,8)·C(X,X)(1,6)·√X(5)·√X(8)·C(X,X)(3,4)·C(X,X)(2,8)·C(X,X)(1,2)·C(X,X)(2,3)·C(X,X)(5,8)·√X(1)·C(X,X)(3,6)·C(X,X)(4,7)·C(X,X)(1,7)·C(X,X)(2,5)
  (gates in application order) from generator 1 of the code's ZX-duality group, computed
  by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[16,8]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
