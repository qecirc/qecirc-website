notes: "Logical CNOT(2,0)·CNOT(5,1)·CNOT(4,3)·CNOT(7,6) (gates in application order),
  from generator 3 of dataset entry [[72,8,8]]dd422:f4e61519 (full_codes_depth1.json)
  of arXiv:2608.05688. The physical circuit is depth-one two-local (two-fold transversal):
  one layer in which each qubit is touched by at most one two-qubit gate; a trailing
  SWAP network, where present, is the string's compensating qubit permutation. The
  dataset is binary-symplectic (sign-free), so the circuit is one Pauli frame of the
  gate — the paper's certificate verifies the full recorded generator set realizes
  the full logical Clifford group Sp(2k,2). The logical_action field states the claim
  in the stored code's logical basis; validate:circuits checks it. This circuit is
  part of the certificate's verified generating prefix: the paper's exact Schreier-Sims
  certificate confirms the logical actions of these 30 circuits generate the full
  logical Clifford group Sp(2k,2)."
