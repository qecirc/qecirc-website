name: FT zero (front search, depth 15, 144 ops)
tool: mqt-qecc
notes: "Fault-tolerant preparation of the logical all-zero state, found by the front
  search of MQT QECC (mqt.qecc.circuit_synthesis.ft_search). Tolerates t = 2 faults:
  every set of at most t faults either sets a detector to 1 or leaves X and Z errors
  of weight at most the number of faults each, up to stabilizers. Post-selection protocol:
  a shot is accepted if every DETECTOR is 0 (detectors are parities of the verification
  measurements and are kept in the stored body). Checked with MQT QECC's exact fault-tolerance
  check, which enumerates every set of up to t faults. 122 CNOTs, 22 measurements,
  two-qubit depth 15 (ASAP schedule). Not in the current collection: an earlier version
  held it, and a later circuit with at most as many operations and no greater depth,
  better in one of the two, replaced it. Kept here as an alternative; a copy of the
  source file is in the QECirc repository, data-imports/mqt-front-search/superseded.
  Source file: scripts/ft_stateprep/front_search/circuits/bga_24_4_5/zero_144_15.stim.
  Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,M,MX. Flag/ancilla
  qubits: 24-45 (22 qubits). Canonicalization qubit permutation (stored qubit i =
  original qubit permutation[i]): [9, 8, 7, 6, 5, 4, 3, 19, 2, 16, 21, 11, 13, 1,
  15, 20, 0, 18, 14, 22, 12, 10, 17, 23]"
