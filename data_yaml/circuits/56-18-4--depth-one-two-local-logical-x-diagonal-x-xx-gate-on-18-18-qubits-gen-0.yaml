name: Depth-one two-local logical X-diagonal (√X/XX) gate on 18/18 qubits (gen 0)
tool: two-fold-transversal
notes: "Logical X-diagonal (√X/XX) gate acting on 18 of the 18 logical qubits, from
  generator 0 of dataset entry [[56,18,4]]kasai:b824a37f (ldpc_codes_depth1.json)
  of arXiv:2608.05688. The physical circuit is depth-one two-local (two-fold transversal):
  one layer in which each qubit is touched by at most one two-qubit gate; a trailing
  SWAP network, where present, is the string's compensating qubit permutation. The
  dataset is binary-symplectic (sign-free), so the circuit is one Pauli frame of the
  gate — the paper's certificate verifies the exact order of the logical group the
  full recorded generator set realizes. The logical_action field states the claim
  in the stored code's logical basis; validate:circuits checks it. One circuit per
  distinct logical action is kept from the recorded generator set; dropping duplicate
  actions preserves the generated logical group."
source: https://arxiv.org/abs/2608.05688
