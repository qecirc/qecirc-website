  Deterministic FT state preparation (arXiv:2501.05527); verification variant: global. Body and metrics show the worst-case branch of the adaptive protocol: prep, round-1 verification (always measured), then the most expensive branch's round-2 measurements. The outcome-dependent Pauli correction is not part of the circuit (Pauli-frame update); apply it per the branch tables below (outcome bits MSB-first in measurement order):
  Layer 0 (Z): round-1 measure Z[1,7,8,14], Z[3,5,11,13]
    outcome 1: measure Z[0,3,8,11], Z[0,3,13,14]; 0 -> X[5], 1 -> X[13], 10 -> X[11], 11 -> X[3]
    outcome 10: measure Z[1,4,11,14], Z[4,7,13,14]; 0 -> X[8], 1 -> X[6,7], 10 -> X[1], 11 -> X[14]
    outcome 11: measure Z[1,3,13,15], Z[4,5,8,9]; 0 -> X[0,1,3], 1 -> X[0,11,14], 10 -> X[8,12,13], 11 -> X[9,10,13]
  Layer 1 (X): round-1 measure X[1,3,4,6,8,10,13,15]* (* = hook flag)
    outcome 1: measure X[0,2,5,7,9,11,12,14]; 0 -> none, 1 -> Z[1]
    hook of stab 0 (outcome 1): measure Z[6,7,12,13], Z[1,7,10,12]; 0 -> X[15], 1 -> X[1,3], 10 -> X[6,13,15], 11 -> X[10,13,15]. Source file: scripts/ft_stateprep/eval_det/circuits/hypercube/zero_heuristic.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [16, 17]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [8, 4, 2, 14, 1, 13, 11, 7, 0, 12, 10, 6, 9, 5, 3, 15]
