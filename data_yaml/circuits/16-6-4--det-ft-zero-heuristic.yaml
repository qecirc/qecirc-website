notes: |-
  Deterministic FT state preparation (arXiv:2501.05527). The stored
  body and metrics show the WORST-CASE branch of an adaptive protocol
  (fair-comparison convention): prep, then per layer the always-measured
  round-1 verification and the most expensive outcome branch (round-2
  measurements + classically-controlled Pauli correction). The actual
  protocol branches on measurement outcomes as tabulated below
  (round-1 outcome bits are MSB-first in measurement order).
  Verification variant: global. Source file: hypercube/zero_heuristic.qasm
  --- Layer 0 (Z-stabilizer verification) ---
    round-1 stab 0: Z[1, 7, 8, 14]
    round-1 stab 1: Z[3, 5, 11, 13]
    round-1 outcome 1: measure Z[0, 3, 8, 11], Z[0, 3, 13, 14]
      round-2 outcome 0: apply X[5]
      round-2 outcome 1: apply X[13]
      round-2 outcome 10: apply X[11]
      round-2 outcome 11: apply X[3]
    round-1 outcome 10: measure Z[1, 4, 11, 14], Z[4, 7, 13, 14]
      round-2 outcome 0: apply X[8]
      round-2 outcome 1: apply X[6, 7]
      round-2 outcome 10: apply X[1]
      round-2 outcome 11: apply X[14]
    round-1 outcome 11: measure Z[1, 3, 13, 15], Z[4, 5, 8, 9]
      round-2 outcome 0: apply X[0, 1, 3]
      round-2 outcome 1: apply X[0, 11, 14]
      round-2 outcome 10: apply X[8, 12, 13]
      round-2 outcome 11: apply X[9, 10, 13]
  --- Layer 1 (X-stabilizer verification) ---
    round-1 stab 0: X[1, 3, 4, 6, 8, 10, 13, 15] [hook flag]
    round-1 outcome 1: measure X[0, 2, 5, 7, 9, 11, 12, 14]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply Z[1]
    hook flag of stab 0 (outcome 1): measure Z[6, 7, 12, 13], Z[1, 7, 10, 12]
      round-2 outcome 0: apply X[15]
      round-2 outcome 1: apply X[1, 3]
      round-2 outcome 10: apply X[6, 13, 15]
      round-2 outcome 11: apply X[10, 13, 15]. Source file: scripts/ft_stateprep/eval_det/circuits/hypercube/zero_heuristic.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [16, 17]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [8, 4, 2, 14, 1, 13, 11, 7, 0, 12, 10, 6, 9, 5, 3, 15]
