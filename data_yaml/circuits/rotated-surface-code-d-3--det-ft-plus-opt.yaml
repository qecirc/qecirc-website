name: Det FT plus (opt)
tool: mqt-qecc
notes: |-
  Deterministic FT state preparation (arXiv:2501.05527). The stored
  body and metrics show the WORST-CASE branch of an adaptive protocol
  (fair-comparison convention): prep, then per layer the always-measured
  round-1 verification and the most expensive outcome branch (round-2
  measurements + classically-controlled Pauli correction). The actual
  protocol branches on measurement outcomes as tabulated below
  (round-1 outcome bits are MSB-first in measurement order).
  Verification variant: global. Source file: surface_3/plus_opt.qasm
  --- Layer 0 (X-stabilizer verification) ---
    round-1 stab 0: X[2, 3, 4] [hook flag]
    round-1 outcome 1: measure X[3, 4, 5]
      round-2 outcome 0: apply Z[2]
      round-2 outcome 1: apply Z[3, 7]
    hook flag of stab 0 (outcome 1): measure Z[]
      round-2 outcome 0: apply X[6]
      round-2 outcome 1: no correction
  --- Layer 1 (Z-stabilizer verification) ---
    (trivial: no verification measurements). Source file: scripts/ft_stateprep/eval_det/circuits/surface_3/plus_opt.qasm. Logical state: plus. Connectivity: fully-connected. Gate set: CX,CZ,H,MR. Flag/ancilla qubits: [9, 10]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [4, 3, 2, 1, 0, 7, 8, 6, 5]
