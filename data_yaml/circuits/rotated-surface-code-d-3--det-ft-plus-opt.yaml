notes: |-
  Deterministic FT state preparation (arXiv:2501.05527); verification variant: global. Body and metrics show the worst-case branch of the adaptive protocol: prep, round-1 verification (always measured), then the most expensive branch's round-2 measurements. The outcome-dependent Pauli correction is not part of the circuit (Pauli-frame update); apply it per the branch tables below (outcome bits MSB-first in measurement order):
  Layer 0 (X): round-1 measure X[2,3,4]* (* = hook flag)
    outcome 1: measure X[3,4,5]; 0 -> Z[2], 1 -> Z[3,7]
    hook of stab 0 (outcome 1): 0 -> X[6], 1 -> none
  Layer 1 (Z): trivial, no verification. Source file: scripts/ft_stateprep/eval_det/circuits/surface_3/plus_opt.qasm. Logical state: plus. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [9, 10]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [4, 3, 2, 1, 0, 7, 8, 6, 5]
source: https://arxiv.org/abs/2501.05527
