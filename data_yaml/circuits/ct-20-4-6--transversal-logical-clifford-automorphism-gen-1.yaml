name: Transversal logical Clifford (automorphism gen 1)
tool: autqec
notes: Logical CNOT(3,4)·CNOT(2,4)·CNOT(1,3)·CNOT(4,2)·CNOT(1,2)·SWAP(3,2)·CNOT(4,1)·CNOT(2,1)·C(X,X)(1,3)·C(X,X)(2,4)·C(X,X)(3,4)
  (gates in application order) from generator 1 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is transversal — single-qubit
  Cliffords, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. The code is the best-known-distance [[20,4]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
