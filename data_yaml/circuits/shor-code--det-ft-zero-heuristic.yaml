  Deterministic FT state preparation (arXiv:2501.05527); verification variant: global. Body and metrics show the worst-case branch of the adaptive protocol: prep, round-1 verification (always measured), then the most expensive branch's round-2 measurements. The outcome-dependent Pauli correction is not part of the circuit (Pauli-frame update); apply it per the branch tables below (outcome bits MSB-first in measurement order):
  Layer 0 (Z): round-1 measure Z[1,2], Z[1,4,6]* (* = hook flag)
    outcome 1: measure Z[0,5,7]; 0 -> none, 1 -> X[3,4,5]
    outcome 10: 0 -> X[2], 1 -> none
    outcome 11: 0 -> X[0,1], 1 -> none
    hook of stab 1 (outcome 1): 0 -> none, 1 -> none
  Layer 1 (X): trivial, no verification. Source file: scripts/ft_stateprep/eval_det/circuits/shor/zero_heuristic.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [9, 10, 11]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [0, 1, 2, 3, 4, 5, 6, 7, 8]
