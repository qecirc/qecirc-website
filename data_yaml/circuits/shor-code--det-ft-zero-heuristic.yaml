tool: mqt-qecc
notes: |-
  Deterministic FT state preparation (arXiv:2501.05527). The stored
  body and metrics show the WORST-CASE branch of an adaptive protocol
  (fair-comparison convention): prep, then per layer the always-measured
  round-1 verification and the most expensive outcome branch (round-2
  measurements + classically-controlled Pauli correction). The actual
  protocol branches on measurement outcomes as tabulated below
  (round-1 outcome bits are MSB-first in measurement order).
  Verification variant: global. Source file: shor/zero_heuristic.qasm
  --- Layer 0 (Z-stabilizer verification) ---
    round-1 stab 0: Z[1, 2]
    round-1 stab 1: Z[1, 4, 6] [hook flag]
    round-1 outcome 1: measure Z[0, 5, 7]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply X[3, 4, 5]
    round-1 outcome 10: measure Z[]
      round-2 outcome 0: apply X[2]
      round-2 outcome 1: no correction
    round-1 outcome 11: measure Z[]
      round-2 outcome 0: apply X[0, 1]
      round-2 outcome 1: no correction
    hook flag of stab 1 (outcome 1): measure X[]
      round-2 outcome 0: no correction
      round-2 outcome 1: no correction
  --- Layer 1 (X-stabilizer verification) ---
    (trivial: no verification measurements). Source file: scripts/ft_stateprep/eval_det/circuits/shor/zero_heuristic.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [9, 10, 11]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [0, 1, 2, 3, 4, 5, 6, 7, 8]
