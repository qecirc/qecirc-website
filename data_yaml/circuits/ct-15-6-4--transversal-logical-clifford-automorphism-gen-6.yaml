tool: autqec
notes: Logical H(6)·CNOT(5,6)·CNOT(2,6)·CNOT(3,5)·CNOT(2,4)·CNOT(1,4)·SWAP(6,4)·SWAP(5,3)·CNOT(1,2)·SWAP(4,1)·CZ(2,3)·CZ(4,5)·CZ(3,6)·S(6)·CZ(2,5)·√X(4)·C(X,X)(2,4)·√X(1)·C(X,X)(1,4)·C(X,X)(2,6)·√X(6)·√X(2)·C(X,X)(1,6)·C(X,X)(4,6)
  (gates in application order) from generator 6 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is transversal — single-qubit
  Cliffords, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. The code is the best-known-distance [[15,6]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
