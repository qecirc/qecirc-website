notes:
  Logical CNOT(6,7)·CNOT(4,7)·CNOT(1,7)·CNOT(4,6)·CNOT(3,6)·CNOT(1,6)·CNOT(4,5)·CNOT(3,5)·CNOT(1,5)·CNOT(7,4)·CNOT(5,4)·CNOT(1,4)·CNOT(6,3)·CNOT(4,3)·CNOT(7,2)·CNOT(6,2)·CNOT(4,2)·CNOT(7,1)·CNOT(6,1)·CNOT(4,1)·CNOT(3,1)·SWAP(2,1)·CZ(4,6)·CZ(1,4)·CZ(5,6)·S(4)·CZ(2,7)·CZ(1,5)·S(2)·CZ(5,7)·CZ(1,2)·S(5)·CZ(1,6)·C(X,X)(6,7)·C(X,X)(4,5)·√X(1)·C(X,X)(3,4)·C(X,X)(4,6)·C(X,X)(1,3)·C(X,X)(4,7)·C(X,X)(1,5)·C(X,X)(5,7)·√X(2)·C(X,X)(1,6)·C(X,X)(2,7)·C(X,X)(3,7)·C(X,X)(5,6)
  (gates in application order) from generator 7 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[18,7]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
