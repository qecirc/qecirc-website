qec_id: 1111
name: Edge-coloring schedule (X/Z split)
tool: qldpc
notes: "One syndrome-extraction round. The X- and Z-check subgraphs are coloured separately,
  then run one colour per tick. On this code the 'Edge-coloring schedule' strategy
  produces the identical round — the two colourings coincide when the Tanner graph
  is small enough, which is a property of this code rather than of either strategy.
  Data qubits 0-14, then the ancillas, measured in index order; every ancilla is prepared
  and read in the X basis. The library states this strategy is not guaranteed to be
  distance-preserving or fault-tolerant. Reproduce with: qldpc.circuits.get_memory_experiment_parts(qldpc.codes.QuantumHammingCode(4),
  qldpc.objects.Pauli.Z, num_rounds=2, syndrome_measurement_strategy=qldpc.circuits.EdgeColoringXZ()).qec_cycle
  — the body stored here is that cycle's REPEAT block with the detectors and observable
  removed, since they belong to the memory experiment rather than to the round."
source: https://arxiv.org/abs/2109.14609
