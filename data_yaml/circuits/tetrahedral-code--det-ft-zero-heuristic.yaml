    outcome 1: measure Z[8,11,13], Z[5,7,9]; 0 -> none, 1 -> X[1,6,8], 10 -> X[5,7,10,13,14], 11 -> X[4,10,11]
    hook of stab 0 (outcome 1): 0 -> Z[7], 1 -> none
