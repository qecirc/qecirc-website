name: SWAP-transversal logical Clifford (automorphism gen 0)
tool: autqec
notes: 'Logical H(1)·H(2)·H(3)·H(4)·H(5)·H(6)·H(7)·H(8)·CNOT(5,8)·CNOT(4,8)·CNOT(3,8)·CNOT(2,8)·CNOT(1,8)·CNOT(6,7)·CNOT(4,7)·SWAP(8,7)·CNOT(8,6)·CNOT(4,6)·CNOT(3,6)·CNOT(8,5)·CNOT(7,5)·CNOT(3,5)·CNOT(1,5)·CNOT(8,4)·CNOT(2,4)·SWAP(5,4)·CNOT(7,3)·CNOT(4,3)·CNOT(1,3)·CNOT(5,2)·CNOT(1,2)·SWAP(3,2)·CNOT(7,1)·SWAP(6,1)
  (gates in application order) from generator 0 of the code''s automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code''s logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  Note: this code shares its [[90,8,10]] parameters with, but is provably inequivalent
  to, the library''s other bivariate bicycle code 90-8-10 — their X-space weight enumerators
  differ (45 weight-6 codewords here vs 90 weight-4 + 600 weight-6 there), which no
  qubit relabeling can reconcile.'
source: https://arxiv.org/abs/2409.18175
