qec_id: 1145
name: Transversal logical Clifford (automorphism gen 5)
tool: autqec
notes:
  Logical H(2)·CNOT(2,4)·CNOT(1,4)·CNOT(2,3)·SWAP(4,3)·CNOT(1,2)·SWAP(3,2)·CNOT(3,1)·CNOT(2,1)·CZ(1,4)·CZ(2,3)·S(4)·S(1)·CZ(3,4)·S(2)·CZ(1,2)·√X(4)·C(X,X)(1,4)·√X(3)·C(X,X)(1,2)·C(X,X)(2,3)
  (gates in application order) from generator 5 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is transversal — single-qubit
  Cliffords, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. The code is the best-known-distance [[11,4]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
