tool: autqec
notes:
  Logical CNOT(6,7)·CNOT(5,7)·CNOT(4,7)·CNOT(3,7)·CNOT(2,7)·CNOT(1,7)·CNOT(5,6)·CNOT(4,6)·CNOT(3,6)·SWAP(7,6)·CNOT(7,5)·CNOT(3,5)·CNOT(7,4)·CNOT(6,4)·CNOT(3,4)·SWAP(5,4)·CNOT(7,3)·CNOT(5,3)·CNOT(4,3)·CNOT(2,3)·CNOT(7,2)·CNOT(1,2)·SWAP(5,2)·CNOT(6,1)·SWAP(4,1)·CZ(3,7)·CZ(1,4)·CZ(4,6)·S(4)·CZ(5,6)·CZ(4,5)·CZ(3,4)·CZ(2,4)·S(3)·CZ(1,3)·CZ(5,7)·S(5)·CZ(2,5)·CZ(3,5)·C(X,X)(6,7)·C(X,X)(2,4)·C(X,X)(4,7)·C(X,X)(2,6)·C(X,X)(2,5)·C(X,X)(2,7)·C(X,X)(3,7)
  (gates in application order) from generator 3 of the code's ZX-duality group, computed
  by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[13,7]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
