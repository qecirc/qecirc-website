  data qubits, so gates stay nearest-neighbour). Partially fault-tolerant: fault distance
  = d=3 for X errors, bounded for Z. Source file: clean_circuits/unrotated_surface_code/unitary_encoding_with_ancilla/Z/unitary_encoding_unrotated_Z_L3_with_ancilla.stim.
