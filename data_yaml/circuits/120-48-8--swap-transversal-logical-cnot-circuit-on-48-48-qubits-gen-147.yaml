qec_id: 16934
name: SWAP-transversal logical CNOT circuit on 48/48 qubits (gen 147)
tool: two-fold-transversal
notes: "Logical CNOT circuit acting on 48 of the 48 logical qubits, from generator
  147 of dataset entry [[120,48,8]]cons:quadric4 (full_codes_depth1.json) of arXiv:2608.05688.
  The physical circuit is depth-one two-local (two-fold transversal): one layer in
  which each qubit is touched by at most one two-qubit gate; a trailing SWAP network,
  where present, is the string's compensating qubit permutation. The dataset is binary-symplectic
  (sign-free), so the circuit is one Pauli frame of the gate — the paper's certificate
  verifies the full recorded generator set realizes the full logical Clifford group
  Sp(2k,2). The logical_action field states the claim in the stored code's logical
  basis; validate:circuits checks it. One circuit per distinct logical action is kept
  from the recorded generator set; dropping duplicate actions preserves the generated
  logical group."
source: https://arxiv.org/abs/2608.05688
