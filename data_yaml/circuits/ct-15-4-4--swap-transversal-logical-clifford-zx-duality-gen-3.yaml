qec_id: 1306
name: SWAP-transversal logical Clifford (ZX-duality gen 3)
tool: autqec
notes: Logical CNOT(2,4)·CNOT(1,4)·CNOT(2,3)·CNOT(1,3)·SWAP(4,3)·CZ(1,2) (gates in
  application order) from generator 3 of the code's ZX-duality group, computed by
  autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit Cliffords
  + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[15,4]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
