qec_id: 1196
name: Transversal logical Clifford (automorphism gen 4)
tool: autqec
notes:
  Logical CNOT(3,4)·CNOT(2,4)·CNOT(2,3)·SWAP(4,3)·CNOT(1,2)·CZ(1,2)·√X(4)·C(X,X)(2,4)·C(X,X)(2,3)·C(X,X)(3,4)·C(X,X)(1,4)·C(X,X)(1,2)·√X(2)
  (gates in application order) from generator 4 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is transversal — single-qubit
  Cliffords, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. The code is the best-known-distance [[13,4]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
