qec_id: 14342
name: Transversal logical Clifford (automorphism gen 3)
tool: autqec
notes:
  Logical CNOT(1,4)·CNOT(4,3)·CNOT(1,3)·CNOT(1,2)·SWAP(3,2)·CNOT(3,1)·SWAP(2,1)·CZ(1,4)·CZ(2,3)·S(1)·S(3)·CZ(1,3)·√X(4)·C(X,X)(2,4)·√X(1)·√X(2)·C(X,X)(1,3)·√X(3)·C(X,X)(2,3)
  (gates in application order) from generator 3 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is transversal — single-qubit
  Cliffords, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. The code is the best-known-distance [[10,4]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
