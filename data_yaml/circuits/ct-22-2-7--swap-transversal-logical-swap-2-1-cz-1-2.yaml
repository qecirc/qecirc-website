name: SWAP-transversal logical SWAP(2,1)·CZ(1,2)
tool: autqec
notes: Logical SWAP(2,1)·CZ(1,2) (gates in application order) from generator 7 of
  the code's automorphism group, computed by autqec (arXiv:2409.18175). Physical circuit
  is swap-transversal — single-qubit Cliffords + SWAPs, with Pauli corrections that
  fix the stabilizer signs. The logical_action field states the claim in the stored
  code's logical basis; validate:circuits checks it. SWAP-transversal circuits are
  fault-tolerant on architectures where SWAPs are error-benign (shuttling ion traps,
  atom arrays), hence no unconditional ft tag. The code is the best-known-distance
  [[22,2]] stabilizer code from Grassl's codetables.de tables (snapshotted in the
  autqec repository).
source: https://arxiv.org/abs/2409.18175
