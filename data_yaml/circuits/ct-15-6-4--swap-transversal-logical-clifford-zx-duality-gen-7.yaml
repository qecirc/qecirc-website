name: SWAP-transversal logical Clifford (ZX-duality gen 7)
tool: autqec
notes: Logical CNOT(4,6)·CNOT(3,6)·CNOT(1,6)·CNOT(6,5)·CNOT(4,5)·CNOT(1,5)·CNOT(6,4)·CNOT(3,4)·CNOT(2,4)·CNOT(1,4)·SWAP(5,4)·CNOT(6,3)·SWAP(5,3)·CNOT(5,2)·CNOT(1,2)·CNOT(4,1)·CNOT(2,1)·C(X,X)(4,5)·C(X,X)(2,4)·C(X,X)(2,5)·C(X,X)(1,3)·C(X,X)(3,6)·C(X,X)(1,5)·C(X,X)(2,6)·√X(6)·C(X,X)(1,2)·C(X,X)(2,3)·C(X,X)(1,6)·√X(5)
  (gates in application order) from generator 7 of the code's ZX-duality group, computed
  by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[15,6]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
