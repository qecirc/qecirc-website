name: Det FT zero (opt)
tool: mqt-qecc
notes: |-
  Deterministic FT state preparation (arXiv:2501.05527); verification variant: global. Body and metrics show the worst-case branch of the adaptive protocol: prep, round-1 verification (always measured), then the most expensive branch's round-2 measurements and classically-controlled Pauli correction. Full branch tables (outcome bits MSB-first in measurement order):
  Layer 0 (Z): round-1 measure Z[1,4,7]* (* = hook flag)
    outcome 1: measure Z[0,4,7]; 0 -> X[1], 1 -> X[7,8]
    hook of stab 0 (outcome 1): 0 -> Z[8], 1 -> none
  Layer 1 (X): trivial, no verification. Source file: scripts/ft_stateprep/eval_det/circuits/surface_3/zero_opt.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [9, 10]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [4, 3, 2, 1, 0, 7, 8, 6, 5]
source: https://arxiv.org/abs/2501.05527
