notes: |-
  Deterministic FT state preparation (arXiv:2501.05527). The stored
  body and metrics show the WORST-CASE branch of an adaptive protocol
  (fair-comparison convention): prep, then per layer the always-measured
  round-1 verification and the most expensive outcome branch (round-2
  measurements + classically-controlled Pauli correction). The actual
  protocol branches on measurement outcomes as tabulated below
  (round-1 outcome bits are MSB-first in measurement order).
  Verification variant: global. Source file: tetrahedral/plus_heuristic.qasm
  --- Layer 0 (X-stabilizer verification) ---
    round-1 stab 0: X[1, 3, 5, 7, 9, 12, 13] [hook flag]
    round-1 outcome 1: measure X[0, 2, 4, 6, 8, 10, 11, 14]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply Z[13]
    hook flag of stab 0 (outcome 1): measure Z[1, 2, 6, 7], Z[5, 6, 11, 13]
      round-2 outcome 0: apply X[0]
      round-2 outcome 1: apply X[12, 13]
      round-2 outcome 10: apply X[1]
      round-2 outcome 11: apply X[0, 1, 3, 5]
  --- Layer 1 (Z-stabilizer verification) ---
    (trivial: no verification measurements). Source file: scripts/ft_stateprep/eval_det/circuits/tetrahedral/plus_heuristic.qasm. Logical state: plus. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [15, 16]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [0, 1, 8, 2, 9, 10, 3, 4, 12, 14, 7, 13, 6, 5, 11]
