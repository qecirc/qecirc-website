  Layer 0 (X): round-1 measure X[1,3,5,7,9,12,13]* (* = hook flag)
    outcome 1: measure X[0,2,4,6,8,10,11,14]; 0 -> none, 1 -> Z[13]
    hook of stab 0 (outcome 1): measure Z[1,2,6,7], Z[5,6,11,13]; 0 -> X[0], 1 -> X[12,13], 10 -> X[1], 11 -> X[0,1,3,5]
  Layer 1 (Z): trivial, no verification. Source file: scripts/ft_stateprep/eval_det/circuits/tetrahedral/plus_heuristic.qasm. Logical state: plus. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [15, 16]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [0, 1, 8, 2, 9, 10, 3, 4, 12, 14, 7, 13, 6, 5, 11]
