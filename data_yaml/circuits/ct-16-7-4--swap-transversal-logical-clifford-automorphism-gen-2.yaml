qec_id: 1393
name: SWAP-transversal logical Clifford (automorphism gen 2)
tool: autqec
notes:
  Logical CNOT(4,7)·CNOT(2,7)·CNOT(4,5)·CNOT(2,5)·CNOT(6,4)·CNOT(2,4)·CNOT(4,3)·CNOT(2,3)·SWAP(6,2)·CNOT(6,1)·CNOT(2,1)
  (gates in application order) from generator 2 of the code's automorphism group,
  computed by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[16,7]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
