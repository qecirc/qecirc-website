  qubits: 17-28 (12 qubits). Canonicalization qubit permutation (stored qubit i =
  original qubit permutation[i]): [1, 5, 8, 9, 13, 0, 2, 11, 10, 4, 12, 15, 6, 3,
  14, 7, 16]"
