notes:
  "Logical H(1)·H(3)·H(5)·CNOT(0,1)·CNOT(0,3)·CNOT(0,5)·H(1)·H(2)·H(4)·CNOT(1,2)·CNOT(1,4)·H(2)·CNOT(2,3)·CNOT(2,5)·H(3)·CNOT(3,4)·H(4)·CNOT(4,5)·H(5)·H(15)·H(15)
  (gates in application order), from generator 18 of dataset entry [[40,16,4]]cons:grid4x10
  (full_codes_depth1.json) of arXiv:2608.05688. The physical circuit is depth-one
  two-local (two-fold transversal): one layer in which each qubit is touched by at
  most one two-qubit gate; a trailing SWAP network, where present, is the string's
  compensating qubit permutation. The dataset is binary-symplectic (sign-free), so
  the circuit is one Pauli frame of the gate — the paper's certificate verifies the
  full recorded generator set realizes the full logical Clifford group Sp(2k,2). The
  logical_action field states the claim in the stored code's logical basis; validate:circuits
  checks it. One circuit per distinct logical action is kept from the recorded generator
  set; dropping duplicate actions preserves the generated logical group."
