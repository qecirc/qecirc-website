notes: Logical H(2)·S(1)·√X(1)·√X(2) (gates in application order) from generator 4
  of the code's automorphism group, computed by autqec (arXiv:2409.18175). Physical
  circuit is transversal — single-qubit Cliffords, with Pauli corrections that fix
  the stabilizer signs. The logical_action field states the claim in the stored code's
  logical basis; validate:circuits checks it. The code is the best-known-distance
  [[15,2]] stabilizer code from Grassl's codetables.de tables (snapshotted in the
  autqec repository).
