name: SWAP-transversal logical Clifford (ZX-duality gen 5)
tool: autqec
notes:
  Logical CNOT(6,7)·CNOT(3,7)·CNOT(1,7)·CNOT(5,6)·CNOT(3,6)·CNOT(2,6)·CNOT(2,5)·SWAP(6,5)·SWAP(5,4)·SWAP(5,3)·CNOT(6,2)·SWAP(4,2)·CNOT(7,1)·CNOT(5,1)·CNOT(4,1)·CNOT(2,1)·√X(1)·C(X,X)(2,3)·C(X,X)(2,4)·√X(7)·C(X,X)(3,6)·C(X,X)(4,7)·C(X,X)(2,6)·√X(6)·C(X,X)(1,7)·C(X,X)(1,2)·C(X,X)(1,4)·C(X,X)(1,6)
  (gates in application order) from generator 5 of the code's ZX-duality group, computed
  by autqec (arXiv:2409.18175). Physical circuit is swap-transversal — single-qubit
  Cliffords + SWAPs, with Pauli corrections that fix the stabilizer signs. The logical_action
  field states the claim in the stored code's logical basis; validate:circuits checks
  it. SWAP-transversal circuits are fault-tolerant on architectures where SWAPs are
  error-benign (shuttling ion traps, atom arrays), hence no unconditional ft tag.
  The code is the best-known-distance [[15,7]] stabilizer code from Grassl's codetables.de
  tables (snapshotted in the autqec repository).
source: https://arxiv.org/abs/2409.18175
