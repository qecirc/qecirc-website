notes: |-
  Deterministic FT state preparation (arXiv:2501.05527); verification variant: global. Body and metrics show the worst-case branch of the adaptive protocol: prep, round-1 verification (always measured), then the most expensive branch's round-2 measurements. The outcome-dependent Pauli correction is not part of the circuit (Pauli-frame update); apply it per the branch tables below (outcome bits MSB-first in measurement order):
  Layer 0 (Z): round-1 measure Z[0,9,13,15], Z[3,4,11,12]
    outcome 1: measure Z[5,6,7,8], Z[1,4,5,9]; 0 -> none, 1 -> X[4,11], 10 -> X[7], 11 -> X[5,8,11]
    outcome 10: measure Z[1,13,14,15], Z[1,4,5,9]; 0 -> X[0], 1 -> X[9], 10 -> X[0,14], 11 -> X[1,14,15]
    outcome 11: 0 -> X[1,12,15], 1 -> X[1,12,15]
  Layer 1 (X): round-1 measure X[4,5,7,11]*, X[0,1,3,5,7,10,12,13]* (* = hook flag)
    outcome 1: measure X[0,10,14,15], X[2,4,6,8,9,11,14,15]; 0 -> none, 1 -> Z[4], 10 -> none, 11 -> Z[0]
    outcome 10: measure X[6,7,11,12]; 0 -> Z[4], 1 -> Z[3,7]
    outcome 11: 0 -> none, 1 -> none
    hook of stab 0 (outcome 1): measure Z[4,6,8,11]; 0 -> X[13], 1 -> X[4,5]
    hook of stab 1 (outcome 1): measure Z[0,4,5,14], Z[0,10,14,15]; 0 -> X[13], 1 -> X[2,12,15], 10 -> none, 11 -> X[0,1]. Source file: scripts/ft_stateprep/eval_det/circuits/16_2_4/zero_heuristic.qasm. Logical state: zero. Connectivity: fully-connected. Gate set: CX,H,MR. Flag/ancilla qubits: [16, 17, 18, 19]. Canonicalization qubit permutation (stored qubit i = original qubit permutation[i]): [6, 5, 4, 12, 3, 11, 7, 8, 2, 13, 1, 9, 0, 14, 15, 10]
