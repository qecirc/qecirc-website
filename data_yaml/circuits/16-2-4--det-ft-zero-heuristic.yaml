notes: |-
  Deterministic FT state preparation (arXiv:2501.05527). The stored
  body and metrics show the WORST-CASE branch of an adaptive protocol
  (fair-comparison convention): prep, then per layer the always-measured
  round-1 verification and the most expensive outcome branch (round-2
  measurements + classically-controlled Pauli correction). The actual
  protocol branches on measurement outcomes as tabulated below
  (round-1 outcome bits are MSB-first in measurement order).
  Verification variant: global. Source file: 16_2_4/zero_heuristic.qasm
  --- Layer 0 (Z-stabilizer verification) ---
    round-1 stab 0: Z[0, 9, 13, 15]
    round-1 stab 1: Z[3, 4, 11, 12]
    round-1 outcome 1: measure Z[5, 6, 7, 8], Z[1, 4, 5, 9]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply X[4, 11]
      round-2 outcome 10: apply X[7]
      round-2 outcome 11: apply X[5, 8, 11]
    round-1 outcome 10: measure Z[1, 13, 14, 15], Z[1, 4, 5, 9]
      round-2 outcome 0: apply X[0]
      round-2 outcome 1: apply X[9]
      round-2 outcome 10: apply X[0, 14]
      round-2 outcome 11: apply X[1, 14, 15]
    round-1 outcome 11: measure Z[]
      round-2 outcome 0: apply X[1, 12, 15]
      round-2 outcome 1: apply X[1, 12, 15]
  --- Layer 1 (X-stabilizer verification) ---
    round-1 stab 0: X[4, 5, 7, 11] [hook flag]
    round-1 stab 1: X[0, 1, 3, 5, 7, 10, 12, 13] [hook flag]
    round-1 outcome 1: measure X[0, 10, 14, 15], X[2, 4, 6, 8, 9, 11, 14, 15]
      round-2 outcome 0: no correction
      round-2 outcome 1: apply Z[4]
      round-2 outcome 10: no correction
      round-2 outcome 11: apply Z[0]
    round-1 outcome 10: measure X[6, 7, 11, 12]
      round-2 outcome 0: apply Z[4]
      round-2 outcome 1: apply Z[3, 7]
    round-1 outcome 11: measure X[]
      round-2 outcome 0: no correction
      round-2 outcome 1: no correction
    hook flag of stab 0 (outcome 1): measure Z[4, 6, 8, 11]
      round-2 outcome 0: apply X[13]
      round-2 outcome 1: apply X[4, 5]
    hook flag of stab 1 (outcome 1): measure Z[0, 4, 5, 14], Z[0, 10, 14, 15]
      round-2 outcome 0: apply X[13]
      round-2 outcome 1: apply X[2, 12, 15]
      round-2 outcome 10: no correction
