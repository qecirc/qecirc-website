name: SWAP-transversal logical CNOT circuit on 9/12 qubits (gen 1)
tool: two-fold-transversal
notes: "Logical CNOT circuit acting on 9 of the 12 logical qubits, from generator
  1 of dataset entry [[36,12,3]]2bga:b6c7c9b2 (ldpc_codes_depth1.json) of arXiv:2608.05688.
  The physical circuit is depth-one two-local (two-fold transversal): one layer in
  which each qubit is touched by at most one two-qubit gate; a trailing SWAP network,
  where present, is the string's compensating qubit permutation. The dataset is binary-symplectic
  (sign-free), so the circuit is one Pauli frame of the gate — the paper's certificate
  verifies the exact order of the logical group the full recorded generator set realizes.
  The logical_action field states the claim in the stored code's logical basis; validate:circuits
  checks it. One circuit per distinct logical action is kept from the recorded generator
  set; dropping duplicate actions preserves the generated logical group."
