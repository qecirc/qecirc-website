notes: Logical S·√X (gates in application order) from generator 5 of the code's automorphism
  group, computed by autqec (arXiv:2409.18175). Physical circuit is swap-transversal
  — single-qubit Cliffords + SWAPs, with Pauli corrections that fix the stabilizer
  signs. The logical_action field states the claim in the stored code's logical basis;
  validate:circuits checks it. SWAP-transversal circuits are fault-tolerant on architectures
  where SWAPs are error-benign (shuttling ion traps, atom arrays), hence no unconditional
  ft tag. The code is the best-known-distance [[13,1]] stabilizer code from Grassl's
  codetables.de tables (snapshotted in the autqec repository).
