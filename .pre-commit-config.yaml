ci:
  autoupdate_commit_msg: "chore(ci): update pre-commit hooks"
  autoupdate_schedule: quarterly
  autofix_commit_msg: "chore(ci): pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      # data_yaml/ holds circuit bodies (.stim/.qasm/.stim-annotated) written
      # byte-for-byte by the ingestion pipeline. These two hooks rewrite them —
      # thousands of files on a full run — which dirties the whole library to no
      # purpose and puts the stored body out of step with what the pipeline emits.
      - id: end-of-file-fixer
        exclude: ^data_yaml/
      - id: trailing-whitespace
        exclude: ^data_yaml/
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.50.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: npx prettier --write --ignore-unknown
        files: \.(astro|ts|tsx|js|jsx|css|json|md|yml|yaml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
