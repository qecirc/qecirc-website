name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  no-private-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Forbid private artifactory references
        run: |
          if git grep -n -F 'jfrog.io' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Found jfrog.io references. QECirc must only use public registries (PyPI, npm)."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run validate:yaml
      - run: npm run build
      - name: Start server
        run: |
          node ./dist/server/entry.mjs &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:4321/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s"; exit 1
        env:
          PORT: 4321
      - name: Run smoke tests
        run: ./scripts/smoke.sh
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.x"
          python-version: "3.13"
      - run: uv lock --check
        env:
          UV_NO_CONFIG: "1"
      - run: uv sync
      - run: uv run ruff check scripts/
      - run: uv run ruff format --check scripts/
      - run: uv run pytest --cov=scripts/add_circuit --cov-fail-under=60
      # Validation results are content-addressed (see scripts/result_cache.py):
      # each entry keys on the circuit/code file contents plus a hash of the
      # validator sources, so restoring a stale cache is always safe — changed
      # or new circuits simply miss and are recomputed. Carrying it across runs
      # makes CI validation proportional to the diff, not the library.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          # No two runs have identical caches (the file rewrites every run), so
          # use a per-run key and restore the most recent via the prefix.
          key: validate-circuits-${{ github.run_id }}
          restore-keys: |
            validate-circuits-
      # Same as `npm run validate:circuits`, invoked directly (no node in this job).
      - run: uv run python scripts/validate_circuits.py
