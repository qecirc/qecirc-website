name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  no-private-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid private artifactory references
        run: |
          if git grep -n -F 'jfrog.io' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Found jfrog.io references. QECirc must only use public registries (PyPI, npm)."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run validate:yaml
      - run: npm run build
      - name: Start server
        run: |
          node ./dist/server/entry.mjs &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:4321/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s"; exit 1
        env:
          PORT: 4321
      - name: Run smoke tests
        run: ./scripts/smoke.sh
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.x"
          python-version: "3.13"
      - run: uv lock --check
        env:
          UV_NO_CONFIG: "1"
      - run: uv sync
      - run: uv run ruff check scripts/
      - run: uv run ruff format --check scripts/
      - run: uv run pytest --cov=scripts/add_circuit --cov-fail-under=60
      # Same as `npm run validate:circuits`, invoked directly (no node in this job).
      - run: uv run python scripts/validate_circuits.py
